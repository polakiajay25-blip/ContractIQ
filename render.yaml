services:
  - type: web
    name: contract-review-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: contract-review-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: REVIEWER_USERNAME
        sync: false
      - key: REVIEWER_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: POLICY_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: REDIS_CACHE_TTL_SECONDS
        value: "3600"

databases:
  - name: contract-review-postgres
    databaseName: contract_reviews
    user: contract_reviews
